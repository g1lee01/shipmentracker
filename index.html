<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>선적 업무 보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>body,button,input,select,textarea{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}</style>
</head>
<body>
  <main>
    <header>
      <div><p>해외영업 · 선적 관리</p><h1>선적 업무 보드</h1></div>
      <div class="header-right"><span id="clock"></span></div>
    </header>

    <section class="summary">
      <article><span>진행 중 선적</span><b id="activeCount">0</b><small>현재 처리 중인 건</small></article>
      <article><span>오늘의 할 일</span><b id="todayCount">0</b><small>마감 기준</small></article>
      <article><span>이번 주 출고</span><b id="dispatchCount">0</b><small>공장 출고 예정</small></article>
      <article><span>이번 주 ETD</span><b id="etdCount">0</b><small>선적 예정</small></article>
    </section>

    <section class="dashboard">
      <article class="panel calendar">
        <div class="panel-head"><div><p>일정 관리</p><h2 id="monthTitle"></h2></div><div><button id="prevMonth">‹</button><button id="nextMonth">›</button></div></div>
        <div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div id="calendarGrid"></div>
      </article>
      <aside class="task-side">
        <article class="panel"><div class="panel-head"><div><p>오늘의 업무</p><h2>오늘의 할 일</h2></div><button id="addTask">＋ 추가</button></div><div id="todayTasks" class="task-list"></div></article>
        <article class="panel"><div class="panel-head"><div><p>예정 업무</p><h2>다가오는 할 일</h2></div></div><div id="upcomingTasks" class="task-list"></div></article>
      </aside>
    </section>

    <section class="shipments">
      <div class="section-head"><div><p>선적 관리</p><h2>선적 진행 현황</h2></div><div class="shipment-tools"><select id="filter"><option value="all">전체 보기</option><option value="active">진행 중</option><option value="done">완료</option></select><button id="addShipment">＋ 새 선적건</button></div></div>
      <div class="tracker-label"><span>선적 정보</span><span>주요 일정</span><span>핵심 진행 항목</span><span>진행률</span></div>
      <div id="shipmentList"></div>
    </section>
  </main>

  <dialog id="taskDialog">
    <form id="taskForm">
      <button class="close" type="button">×</button>
      <h2>할 일 추가</h2>
      <div class="static-color-chips" aria-label="색상 선택">
        <button type="button" class="selected" title="로즈" style="background:#e9aab8" onclick="this.form.elements.color.value='pink';this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')"></button>
        <button type="button" title="레드" style="background:#df7d7d" onclick="this.form.elements.color.value='red';this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')"></button>
        <button type="button" title="오렌지" style="background:#e8a052" onclick="this.form.elements.color.value='orange';this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')"></button>
        <button type="button" title="골드" style="background:#d4ad4a" onclick="this.form.elements.color.value='gold';this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')"></button>
        <button type="button" title="그린" style="background:#75ad83" onclick="this.form.elements.color.value='green';this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')"></button>
        <button type="button" title="블루" style="background:#82aeda" onclick="this.form.elements.color.value='blue';this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')"></button>
        <button type="button" title="퍼플" style="background:#aa8ac9" onclick="this.form.elements.color.value='purple';this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));this.classList.add('selected')"></button>
      </div>
      <label>할 일<input name="title" required placeholder="예: 선적 서류 확인"></label>
      <label>날짜<input name="date" type="date" required></label>
      <label>시간<select name="time"><option value="">시간 선택</option><option value="00:00">00:00</option><option value="00:30">00:30</option><option value="01:00">01:00</option><option value="01:30">01:30</option><option value="02:00">02:00</option><option value="02:30">02:30</option><option value="03:00">03:00</option><option value="03:30">03:30</option><option value="04:00">04:00</option><option value="04:30">04:30</option><option value="05:00">05:00</option><option value="05:30">05:30</option><option value="06:00">06:00</option><option value="06:30">06:30</option><option value="07:00">07:00</option><option value="07:30">07:30</option><option value="08:00">08:00</option><option value="08:30">08:30</option><option value="09:00">09:00</option><option value="09:30">09:30</option><option value="10:00">10:00</option><option value="10:30">10:30</option><option value="11:00">11:00</option><option value="11:30">11:30</option><option value="12:00">12:00</option><option value="12:30">12:30</option><option value="13:00">13:00</option><option value="13:30">13:30</option><option value="14:00">14:00</option><option value="14:30">14:30</option><option value="15:00">15:00</option><option value="15:30">15:30</option><option value="16:00">16:00</option><option value="16:30">16:30</option><option value="17:00">17:00</option><option value="17:30">17:30</option><option value="18:00">18:00</option><option value="18:30">18:30</option><option value="19:00">19:00</option><option value="19:30">19:30</option><option value="20:00">20:00</option><option value="20:30">20:30</option><option value="21:00">21:00</option><option value="21:30">21:30</option><option value="22:00">22:00</option><option value="22:30">22:30</option><option value="23:00">23:00</option><option value="23:30">23:30</option></select></label>
      <label>리마인더<select name="reminder"><option value="">알림 안 함</option><option value="0">정시</option><option value="5">5분 전</option><option value="15">15분 전</option><option value="30">30분 전</option><option value="60">1시간 전</option><option value="120">2시간 전</option><option value="1440">1일 전</option><option value="4320">3일 전</option></select></label>
      <label class="hidden-task-color">색상<select name="color"><option value="pink">로즈</option><option value="red">레드</option><option value="orange">오렌지</option><option value="gold">골드</option><option value="green">그린</option><option value="blue">블루</option><option value="purple">퍼플</option></select></label>
      <div class="actions"><button class="cancel" type="button">취소</button><button class="primary">저장</button></div>
    </form>
  </dialog>

  <dialog id="shipmentDialog">
    <form id="shipmentForm">
      <button class="close" type="button">×</button>
      <h2>새 선적건</h2>
      <label>제품명<input name="product" required placeholder="예: NPK 15-15-15"></label>
      <label>국가<input name="country" required placeholder="예: Philippines"></label>
      <label>도착항<input name="port" required placeholder="예: Manila"></label>
      <div class="form-row"><label>출고일<input name="dispatch" type="date"></label><label>ETD<input name="etd" type="date"></label><label>ETA<input name="eta" type="date"></label></div>
      <div class="actions"><button class="cancel" type="button">취소</button><button class="primary">저장</button></div>
    </form>
  </dialog>
  <script>
    (() => {
      const timeSelect = document.querySelector('#taskForm select[name="time"]');
      if (!timeSelect) return;
      [...timeSelect.options].forEach(option => {
        if (!option.value) return;
        const [hour, minute] = option.value.split(':').map(Number);
        option.textContent = `${hour < 12 ? 'AM' : 'PM'} ${hour % 12 || 12}:${String(minute).padStart(2, '0')}`;
      });
      timeSelect.addEventListener('wheel', event => {
        event.preventDefault();
        const direction = event.deltaY > 0 ? 1 : -1;
        const next = Math.max(0, Math.min(timeSelect.options.length - 1, timeSelect.selectedIndex + direction));
        if (next === timeSelect.selectedIndex) return;
        timeSelect.selectedIndex = next;
        timeSelect.dispatchEvent(new Event('change', { bubbles: true }));
      }, { passive: false });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js?v=new-entry-date-defaults-2"></script>
  <script src="ui-enhancements.js?v=checklist-progress-refresh-1"></script>
  <script src="sync.js?v=weekly-preview-left-align-3"></script>
  <script src="history-import.js?v=history-import-1"></script>
  <style>
    .key-tasks label { font-size: 13px !important; }
    .key-tasks input { font-size: 12px !important; }
    .key-tasks { display: grid !important; grid-template-columns: repeat(5, minmax(0, 1fr)) 22px !important; gap: 10px !important; align-items: start !important; }
    .key-tasks label { display: grid !important; grid-template-rows: auto 27px; justify-items: center !important; align-items: start; text-align: center !important; min-width: 0; }
    .key-tasks input { width: 100% !important; max-width: 156px; margin: 5px 0 0 !important; justify-self: center !important; text-align: center !important; }
    .key-tasks .open { align-self: center; justify-self: center; }
    #taskForm { position: relative; }
    #taskForm > label:has([name="date"]), #taskForm > label:has([name="endDate"]) { order: 2; }
    #taskForm > label:has([name="time"]), #taskForm > label:has([name="reminder"]) { order: 3; }
    #taskForm > label:has([name="repeat"]), #taskForm > label:has([name="status"]) { order: 4; }
    #taskForm > label:has([name="time"]), #taskForm > label:has([name="repeat"]) { grid-column: 1 !important; }
    #taskForm > label:has([name="reminder"]), #taskForm > label:has([name="status"]) { grid-column: 2 !important; }
    #taskForm > label:has([name="title"]) { order: 1; }
    #taskForm > .actions { order: 7; }
    #taskForm > .hidden-task-color { display: none !important; }
    #taskForm .static-color-chips { position: absolute; top: 3px; right: 20px; z-index: 2; display: flex; gap: 6px; }
    #taskForm .static-color-chips button { width: 13px; min-width: 13px; height: 13px; padding: 0; border: 1px solid #cbd5d0; border-radius: 50%; }
    #taskForm .static-color-chips button.selected { outline: 2px solid var(--green); outline-offset: 2px; }
  </style>
</body>
</html>
